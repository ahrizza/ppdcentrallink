# Base44 sandbox dev environment — do not use for production.
#
# The app is a single static `index.html` (Tailwind/SweetAlert/Lucide/Chart.js from
# CDNs) that talks to Firebase (Auth + Realtime Database) and Cloudinary directly
# from the browser. There is no build step and no server-side code, so a single
# service serves the cloned source with live reload.
services:
  web:
    image: node:22-slim
    working_dir: /app
    # Serves the bind-mounted source on 0.0.0.0:3000 and reloads the browser on change.
    command: ["node", ".base44/dev-server.mjs"]
    environment:
      - PORT=3000
      - BASE44_PREVIEW_MODE
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
